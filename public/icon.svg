<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e5322d" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.3" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle with Brand Red Gradient -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Document Sheet with Shadow -->
  <g filter="url(#shadow)">
    <!-- Document Body with Folded Top Right Corner -->
    <path d="M140 96 H312 L388 172 V416 C388 424.8 380.8 432 372 432 H140 C131.2 432 124 424.8 124 416 V112 C124 103.2 131.2 96 140 96 Z" fill="#ffffff" />
    
    <!-- Folded Corner Flap -->
    <path d="M312 96 V164 C312 168.4 315.6 172 320 172 H388 Z" fill="url(#foldGrad)" />
  </g>

  <!-- PDF Badge Pill inside Document -->
  <rect x="164" y="228" width="184" height="64" rx="14" fill="#e5322d" />
  <text x="256" y="273" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4" text-anchor="middle">PDF</text>

  <!-- Document Content Preview Lines -->
  <rect x="164" y="324" width="184" height="14" rx="7" fill="#cbd5e1" />
  <rect x="164" y="356" width="132" height="14" rx="7" fill="#cbd5e1" />
  <rect x="164" y="388" width="88" height="14" rx="7" fill="#e2e8f0" />
</svg>
